name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    name: Test & Verify Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: nutrilog

      # mealtime-nutrition is a path dependency until it reaches PyPI, so the
      # runner needs it beside this checkout. actions/checkout cannot write
      # outside the workspace, hence both repositories sit inside it.
      - uses: actions/checkout@v7
        with:
          repository: mealtime-tools/nutrition
          path: nutrition

      # Pinned exactly: setup-uv dropped its floating major tags after v7,
      # so v8 and later only exist as exact versions.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Run test suite
        run: uv run --extra dev pytest --cov=nutrilog
        working-directory: nutrilog

  build-and-publish:
    name: Build & Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nutrilog
    permissions:
      id-token: write  # Required for PyPI Trusted Publishing (OIDC)
      contents: write  # Required for GitHub Release creation

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "latest"

      - name: Build distributions (sdist & wheel)
        run: uv build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
