[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nutrilog"
version = "0.1.7"
description = "A standalone, privacy-first CLI tool for logging meals, macronutrients, and calories directly to Google Health."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Nutrilog Contributors" }
]
keywords = ["health", "nutrition", "google-health", "macros", "calories", "cli", "fitbit"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "python-dateutil>=2.9.0",
]

[project.scripts]
nutrilog = "nutrilog.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "respx>=0.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["nutrilog"]

[tool.pytest.ini_options]
testpaths = ["nutrilog"]
python_files = ["*_test.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
